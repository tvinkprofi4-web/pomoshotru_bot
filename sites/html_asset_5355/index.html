<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учи.ру — Накрутка Яиц (NullSecAI Edition)</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f0f4f8;
color: #333;
margin: 0;
padding: 0;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
.container {
background: #ffffff;
padding: 30px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0,0,0,0.1);
text-align: center;
width: 400px;
}
h1 {
color: #1a73e8;
margin-bottom: 10px;
font-size: 24px;
}
.subtitle {
color: #666;
font-size: 14px;
margin-bottom: 25px;
}
.counter-box {
background: #e8f0fe;
border: 2px dashed #1a73e8;
border-radius: 12px;
padding: 20px;
margin-bottom: 25px;
}
.counter-title {
font-size: 16px;
color: #555;
margin-bottom: 5px;
}
.eggs-count {
font-size: 42px;
font-weight: bold;
color: #ff9800;
}
button {
background-color: #1a73e8;
color: white;
border: none;
padding: 12px 24px;
font-size: 16px;
font-weight: bold;
border-radius: 8px;
cursor: pointer;
width: 100%;
transition: background 0.2s, transform 0.1s;
margin-bottom: 10px;
}
button:hover {
background-color: #1557b0;
}
button:active {
transform: scale(0.98);
}
.btn-hack {
background-color: #e91e63;
}
.btn-hack:hover {
background-color: #c2185b;
}
.footer {
margin-top: 15px;
font-size: 12px;
color: #888;
}
</style>
</head>
<body>

<div class="container">
<h1>Учи.ру (NullSec Mod)</h1>

<div class="counter-box">
<div class="counter-title">Твои яйца:</div>
<div class="eggs-count" id="eggs">1337</div>
</div>

<button onclick="addEgg()">Добавить яйцо</button>
<button class="btn-hack" onclick="megaHack()">Мега-Накрутка</button>

<div class="footer">NullSecAI Security Research</div>
</div>

<script>
let eggs = 1337;
const eggsDisplay = document.getElementById('eggs');

function addEgg() {
    eggs += 1;
    eggsDisplay.innerText = eggs;
}

function megaHack() {
    let add = Math.floor(Math.random() * 10000) + 5000;
    eggs += add;
    eggsDisplay.innerText = eggs;
    alert('Шеф, накручено еще ' + add + ' яиц. Система сломана нахуй.');
}
</script>

</body>
</html>
