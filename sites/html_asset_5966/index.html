<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учи.ру — Личный кабинет (Накрутка яиц)</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
background-color: #f0f4f8;
color: #333;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
.container {
width: 100%;
max-width: 450px;
background: #ffffff;
padding: 30px;
border-radius: 12px;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
}
h2 {
text-align: center;
color: #0076ff;
margin-bottom: 20px;
}
.form-group {
margin-bottom: 15px;
}
label {
display: block;
margin-bottom: 5px;
font-weight: 600;
color: #555;
}
input {
width: 100%;
padding: 12px;
border: 1px solid #ccc;
border-radius: 6px;
font-size: 16px;
}
button {
width: 100%;
padding: 12px;
background-color: #0076ff;
color: white;
border: none;
border-radius: 6px;
font-size: 16px;
font-weight: bold;
cursor: pointer;
transition: background 0.2s;
}
button:hover {
background-color: #005bb5;
}
.dashboard {
display: none;
}
.balance-card {
background: linear-gradient(135deg, #ffc107, #ff9800);
color: white;
padding: 20px;
border-radius: 8px;
text-align: center;
font-size: 24px;
font-weight: bold;
margin-bottom: 20px;
box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
}
.tier-list {
background: #f9f9f9;
border: 1px solid #e0e0e0;
border-radius: 8px;
padding: 15px;
}
.tier-list h3 {
margin-bottom: 10px;
font-size: 18px;
color: #333;
border-bottom: 2px solid #0076ff;
padding-bottom: 5px;
}
.tier-item {
display: flex;
justify-content: space-between;
padding: 8px 0;
border-bottom: 1px solid #eee;
font-size: 15px;
}
.tier-item:last-child {
border-bottom: none;
}
.rank-1 { color: #d4af37; font-weight: bold; }
.rank-2 { color: #c0c0c0; font-weight: bold; }
.rank-3 { color: #cd7f32; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<!-- Экран авторизации -->
<div id="auth-screen">
<h2>Учи.ру Вход</h2>
<div class="form-group">
<label for="login">Логин</label>
<input type="text" id="login" value="75">
</div>
<div class="form-group">
<label for="password">Пароль</label>
<input type="text" id="password" value="912пляж2">
</div>
<button onclick="loginUser()">Войти в систему</button>
</div>

<!-- Экран личного кабинета (скрыт по умолчанию) -->
<div id="dashboard-screen" class="dashboard">
<h2>Личный кабинет Учи.ру</h2>
<div class="balance-card">
9999 яиц 🥚
</div>

<div class="tier-list">
<h3>Тир-лист участников</h3>
<div class="tier-item"><span class="rank-1">1. Александр</span> <span>1250 яиц</span></div>
<div class="tier-item"><span class="rank-2">2. Иван</span> <span>980 яиц</span></div>
<div class="tier-item"><span class="rank-3">3. Кирилл</span> <span>850 яиц</span></div>
<div class="tier-item"><span>4. Платон</span> <span>620 яиц</span></div>
<div class="tier-item" style="color: #888;"><span>5. никто</span> <span>0 яиц</span></div>
</div>
</div>
</div>

<script>
function loginUser() {
const loginInput = document.getElementById('login').value;
const passInput = document.getElementById('password').value;

if (loginInput.trim() !== "" && passInput.trim() !== "") {
document.getElementById('auth-screen').style.display = 'none';
document.getElementById('dashboard-screen').style.display = 'block';
} else {
alert('Заполни поля, шеф.');
}
}
</script>

</body>
</html>
